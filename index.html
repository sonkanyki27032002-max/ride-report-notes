<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RideReport" />
    <link rel="icon" type="image/png" href="./assets/favicon-BKmVCxLy.png" />
    <link rel="shortcut icon" type="image/png" href="./assets/favicon-BKmVCxLy.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon-CGCO4KRv.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Ride Report Notes - S.H.E Technical Department</title>
    <script type="module" crossorigin src="./assets/index-y6YzytXw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BLL421dd.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      // Fallback: Nếu không tải được bundle assets (do chưa upload folder assets), tự động chuyển sang file HTML độc lập
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.src || '').includes('assets')) {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          window.location.replace(isIOS ? './ride-report-ios.html' : './ride-report-android.html');
        }
      }, true);
      // Timeout fallback nếu sau 2.5s mà root vẫn chưa render
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          window.location.replace(isIOS ? './ride-report-ios.html' : './ride-report-android.html');
        }
      }, 2500);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
            .catch(err => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
